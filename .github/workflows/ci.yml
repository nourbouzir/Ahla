# Continuous Integration — runs automatically on every push and pull request.
#
# Philosophy for this course: KEEP IT LIGHT. CI should catch obvious breakage
# and remind you about docs — not become a second job. Every stack block only
# runs if its manifest file exists, so CI stays green on a repo that has docs
# but no code yet.
#
# AHLA is a Laravel 12 / PHP 8.3 project: the PHP block starts running as soon
# as composer.json is committed (sprint 1).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # MySQL only for the booking concurrency tests (row locks need a real server).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ahla_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the docs check can diff commits

      # --- PHP / Laravel (only runs if composer.json exists) ------------------
      - name: Set up PHP
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Install PHP deps
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        if: ${{ hashFiles('composer.json') != '' }}
        run: |
          cp .env.example .env
          php artisan key:generate

      # --- Front-end assets (only runs if package.json exists) ----------------
      - name: Set up Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Build front-end assets
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present

      - name: Check PHP code style
        # Laravel Pint in check-only mode; fix locally with `composer lint:fix`.
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer lint

      - name: Run PHP tests
        # Tests use an in-memory SQLite database (set in phpunit.xml), so CI
        # needs no MySQL service. Row-lock/concurrency tests need MySQL and are
        # run locally (TODO: add a mysql service when those tests exist).
        if: ${{ hashFiles('composer.json') != '' }}
        run: php artisan test

      - name: Booking concurrency tests (MySQL)
        if: ${{ hashFiles('composer.json') != '' }}
        env:
          AHLA_MYSQL_TESTS: "1"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: ahla_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --filter=BookingConcurrency

      # --- Docs reminder (always runs, never fails the build) -----------------
      - name: Docs reminder
        run: bash scripts/check-docs.sh
