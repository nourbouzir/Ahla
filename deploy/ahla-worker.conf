; Supervisor program for the queue worker (translation, e-mail). Copy to /etc/supervisor/conf.d/
; then: supervisorctl reread && supervisorctl update
[program:ahla-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ahla/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/ahla
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/ahla/storage/logs/worker.log
