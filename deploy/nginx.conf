# Nginx site for Ahla. Replace ahla.example.com and the certificate paths (Let's Encrypt: certbot --nginx).
server {
    listen 80;
    server_name ahla.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ahla.example.com;
    root /var/www/ahla/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/ahla.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahla.example.com/privkey.pem;

    client_max_body_size 6m;   # ID evidence up to 5 MB

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles (.env) or anything outside public/.
    location ~ /\.(?!well-known) { deny all; }

    location ~* \.(?:css|js|svg|png|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
